backend:
  name: github
  repo: aixiatw/dr-wu-new
  branch: main
  base_url: https://workers.dev
  site_domain: dr-wu-new.aixiatw.workers.dev

local_backend: true

media_folder: src/assets/images
public_folder: /src/assets/images

collections:
  - name: settings
    label: 網站設定
    files:
      - name: home
        label: 首頁設定
        file: src/content/settings/home.json
        fields:
          - label: 網站標題
            name: title
            widget: string
          - label: Logo 圖片
            name: logo
            widget: image
          - label: 醫師大頭照
            name: doctor_photo
            widget: image
          - label: 醫師姓名
            name: doctor_name
            widget: string
          - label: 醫師職稱
            name: doctor_title
            widget: string
          - label: 醫師簡介
            name: doctor_bio
            widget: markdown
          - label: 服務項目
            name: services
            widget: list
            fields:
              - label: 項目名稱
                name: name
                widget: string
              - label: 項目說明
                name: description
                widget: string
      - name: about
        label: 關於醫師
        file: src/content/settings/about.json
        fields:
          - label: 醫師照片
            name: photo
            widget: image
          - label: 姓名
            name: name
            widget: string
          - label: 職稱
            name: title
            widget: string
          - label: 現職
            name: current_position
            widget: string
          - label: 學經歷
            name: experience
            widget: markdown
          - label: 專科認證
            name: certifications
            widget: list
            fields:
              - label: 認證名稱
                name: name
                widget: string
      - name: contact
        label: 聯絡方式
        file: src/content/settings/contact.json
        fields:
          - label: 地址
            name: address
            widget: string
          - label: 電話
            name: phone
            widget: string
          - label: 門診時間
            name: hours
            widget: markdown
          - label: Google Maps 連結
            name: map_url
            widget: string
            required: false

  - name: blog
    label: 衛教文章
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - label: 標題
        name: title
        widget: string
      - label: 分類
        name: category
        widget: string
      - label: 發布日期
        name: date
        widget: datetime
      - label: 作者
        name: author
        widget: string
        default: 吳文綺醫師
      - label: 摘要
        name: description
        widget: string
      - label: 封面圖片
        name: image
        widget: image
        required: false
      - label: 內容
        name: body
        widget: markdown
      - label: 草稿
        name: draft
        widget: boolean
        default: false