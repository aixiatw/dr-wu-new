<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>內容管理後台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #F5E6D3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      width: 100%;
      max-width: 360px;
    }
    h2 { color: #4A3728; margin: 0 0 20px 0; }
    p { color: #8B6F5C; margin: 0 0 20px 0; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 2px solid #E8D5C4;
      border-radius: 8px;
      font-size: 16px;
      display: block;
    }
    input:focus { outline: none; border-color: #D4856A; }
    button {
      width: 100%;
      padding: 14px;
      background: #D4856A;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover { background: #c06f54; }
    .error { color: #e74c3c; margin-top: 12px; font-size: 14px; display: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>🔐 後台登入</h2>
    <p>輸入密碼進入 CMS</p>
    <input type="password" id="password" placeholder="密碼">
    <button onclick="checkLogin()">登入</button>
    <div class="error" id="error">密碼錯誤</div>
  </div>

  <script>
    function checkLogin() {
      var pass = document.getElementById('password').value;
      if (pass === 'zxcvbnm168') {
        document.body.innerHTML = '<div style="text-align:center;padding:50px;color:#4A3728;"><h2>載入 CMS...</h2></div>';
        var script = document.createElement('script');
        script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
        document.head.appendChild(script);
      } else {
        document.getElementById('error').style.display = 'block';
      }
    }
  </script>
</body>
</html>
